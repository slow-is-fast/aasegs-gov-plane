name: gov-plane

# 控制面自检：执行器负向用例必须全绿。
# 本 workflow 运行在控制面仓库（独立信任域），不依赖数据面任何内容。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  executor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 不再写死用例数：写死就会过期（2026-10-30 复核时这里是 "(10 cases)"，
      # 实际已 88 条）。步骤名与事实不符本身就是一种记账不实。
      - name: Executor negative tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
